services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sous
      POSTGRES_USER: sous
      POSTGRES_PASSWORD: sous
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sous -d sous"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Defaults so `docker compose up` works without a .env; values in .env win.
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me-to-a-long-random-string}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Always the compose db service, regardless of the local-dev value in .env.
      DATABASE_URL: postgres://sous:sous@db:5432/sous
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
