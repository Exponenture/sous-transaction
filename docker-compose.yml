services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sous
      POSTGRES_USER: sous
      POSTGRES_PASSWORD: sous
    ports:
      # Host port 5433 so a local Postgres on 5432 doesn't clash; override with DB_PORT.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sous -d sous"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      # Defaults so `docker compose up` works without a .env; values in .env win.
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-dev-insecure-change-me-to-a-long-random-string}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      # Always the compose db service, regardless of the local-dev value in .env.
      DATABASE_URL: postgres://sous:sous@db:5432/sous
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # Healthy only once migrations have run and gunicorn answers, so `up --wait` really waits.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  pgdata:
