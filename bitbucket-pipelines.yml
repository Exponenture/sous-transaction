# Bitbucket Pipelines: backend (ruff + pytest against Postgres 16) on every push.
image: python:3.12

definitions:
  services:
    postgres:
      image: postgres:16
      variables:
        POSTGRES_DB: sous
        POSTGRES_USER: sous
        POSTGRES_PASSWORD: sous

  steps:
    - step: &backend
        name: Backend lint + test
        caches: [pip]
        services: [postgres] # reachable on localhost:5432
        script:
          - export DEBUG=true SECRET_KEY=ci-only-insecure-key-at-least-32-bytes
          - export DATABASE_URL=postgres://sous:sous@localhost:5432/sous
          - cd backend
          - pip install -r requirements-dev.txt
          - ruff check . && ruff format --check .
          - pytest
          - python manage.py makemigrations --check --dry-run
    - step: &docker-smoke
        name: Docker Compose smoke
        image: docker:27-cli
        services: [docker]
        script:
          - apk add --no-cache python3
          - export COMPOSE_PROJECT_NAME=sous-ci-smoke DEBUG=true ANTHROPIC_API_KEY=""
          - docker compose up --build --detach --wait --wait-timeout 120
          - python3 backend/tests/docker_smoke.py
        after-script:
          - export COMPOSE_PROJECT_NAME=sous-ci-smoke
          - docker compose logs --no-color
          - docker compose down --volumes
pipelines:
  default:
    - step: *backend
    - step: *docker-smoke
